# Practice material for task D. It contains deliberate security problems.
# It lives outside .github/workflows/ so it never runs. Don't copy it.
name: Publish preview

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: write-all

env:
  DEPLOY_USER: preview-bot
  DEPLOY_PASSWORD: Sommer2024!

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          echo "Building preview for: ${{ github.event.pull_request.title }}"
          pip install -r requirements.txt
          python build.py --out site/

      - name: Deploy
        uses: some-org/deploy-preview@main
        with:
          user: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          path: site/

      - name: Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body "Preview is ready"
