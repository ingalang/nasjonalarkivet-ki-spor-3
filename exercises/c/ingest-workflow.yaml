# Fictional Argo workflow for task C. It is not used anywhere.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: ingest-
spec:
  entrypoint: main
  onExit: notify
  arguments:
    parameters:
      - name: package-id
      - name: priority
        value: "normal"
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
  templates:
    - name: main
      dag:
        tasks:
          - name: fetch
            template: fetch
          - name: checksum
            template: checksum
            dependencies: [fetch]
          - name: virus-scan
            template: virus-scan
            dependencies: [fetch]
          - name: validate
            template: validate
            dependencies: [checksum, virus-scan]
          - name: convert
            template: convert
            dependencies: [validate]
            when: "{{tasks.validate.outputs.parameters.needs-conversion}} == true"
          - name: store
            template: store
            depends: "validate.Succeeded && (convert.Succeeded || convert.Skipped)"
          - name: index
            template: index
            dependencies: [store]
            when: "{{workflow.parameters.priority}} != low"

    - name: fetch
      container:
        image: registry.example/ingest-tools:1.4
        command: [fetch-package, "{{workflow.parameters.package-id}}", /work/in]
        volumeMounts: [{ name: work, mountPath: /work }]

    - name: checksum
      retryStrategy:
        limit: 3
      container:
        image: registry.example/ingest-tools:1.4
        command: [verify-checksums, /work/in]
        volumeMounts: [{ name: work, mountPath: /work }]

    - name: virus-scan
      retryStrategy:
        limit: 2
        retryPolicy: OnError
      container:
        image: registry.example/clamav:1.3
        command: [clamscan, -r, --no-summary, /work/in]
        volumeMounts: [{ name: work, mountPath: /work }]

    - name: validate
      outputs:
        parameters:
          - name: needs-conversion
            valueFrom:
              path: /work/needs-conversion
              default: "false"
      container:
        image: registry.example/ingest-tools:1.4
        command: [validate-package, /work/in, --report, /work/report.json, --flag, /work/needs-conversion]
        volumeMounts: [{ name: work, mountPath: /work }]

    - name: convert
      activeDeadlineSeconds: 3600
      container:
        image: registry.example/converter:2.0
        command: [convert-to-archival, /work/in, /work/out]
        volumeMounts: [{ name: work, mountPath: /work }]

    - name: store
      script:
        image: registry.example/ingest-tools:1.4
        command: [sh]
        source: |
          src=/work/in
          [ -d /work/out ] && src=/work/out
          store-package "$src" --id "{{workflow.parameters.package-id}}"
        volumeMounts: [{ name: work, mountPath: /work }]

    - name: index
      container:
        image: registry.example/indexer:3.1
        command: [index-package, "{{workflow.parameters.package-id}}"]

    - name: notify
      container:
        image: registry.example/notify:1.0
        command: [notify, "--status={{workflow.status}}", "--id={{workflow.parameters.package-id}}"]
