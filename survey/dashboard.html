<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spor 3 – Tilbakemeldinger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: view switcher over one stage; the stage renders Storskjerm, Rutenett or Kryssanalyse from the same rows. */
:root {
  --bg: #f4f3f0; --surface: #fcfcfb; --border: #e4e2dc; --track: #ecebe6;
  --text: #0b0b0b; --text-2: #52514e; --muted: #77766f;
  --series: #2a78d6; --series-soft: #2a78d61f; --dim: #c9c8c1; --live: #1baf7a;
  --on-strong: #ffffff; --focus: #2a78d6;
  /* Q4 diverging: red arm (1–2), grey midpoint (3), blue arm (4–5) */
  --d1: #e34948; --d2: #f0a3a2; --d3: #d6d5cf; --d4: #86b6ef; --d5: #2a78d6;
  --font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --border: #2c2c2a; --track: #262624;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e88;
  --series: #3987e5; --series-soft: #3987e526; --dim: #3a3a37; --live: #199e70;
  --on-strong: #ffffff; --focus: #6da7ec;
  --d1: #e66767; --d2: #8a3b3b; --d3: #4a4a46; --d4: #1c5cab; --d5: #5598e7;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --border: #2c2c2a; --track: #262624;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e88;
  --series: #3987e5; --series-soft: #3987e526; --dim: #3a3a37; --live: #199e70;
  --on-strong: #ffffff; --focus: #6da7ec;
  --d1: #e66767; --d2: #8a3b3b; --d3: #4a4a46; --d4: #1c5cab; --d5: #5598e7;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.tn { font-variant-numeric: tabular-nums; }

/* ---------- View bar ---------- */
.mock { margin-bottom: 20px; }
.mock-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--track); border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px #0000001a; }
.rec { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--series); margin-left: 6px; }
.sim { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--text-2); }
.btn { border: 1px solid var(--border); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--series); border-color: var(--series); color: var(--on-strong); }
.btn[aria-pressed="true"] { background: var(--series-soft); border-color: var(--series); }
label.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.note { margin: 0; font-size: 14px; color: var(--text-2); max-width: 90ch; }
.note b { color: var(--text); }

/* ---------- Shared dashboard pieces ---------- */
.stage { container-type: inline-size; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.eyebrow { color: var(--text-2); font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
h1 { margin: 2px 0 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
h2 { margin: 0; font-size: 15px; font-weight: 600; }
.q { color: var(--text-2); font-size: 13px; margin: 2px 0 14px; }
.live { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 2s infinite; }
.dot.off { background: var(--muted); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; min-width: 0; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
@container (max-width: 860px) { .s3 { grid-column: span 6; } .s4, .s5, .s6, .s7, .s8 { grid-column: span 12; } }
@container (max-width: 480px) { .s3 { grid-column: span 12; } }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: var(--series-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* horizontal bars */
.bars { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(96px, 36%) 1fr 72px; align-items: center; gap: 12px; font-size: 13px; }
.row .name { color: var(--text-2); overflow-wrap: anywhere; }
.track { height: 18px; background: var(--track); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--series); border-radius: 0 4px 4px 0; transition: width .6s cubic-bezier(.2,.8,.2,1), background .3s; }
.row .num { text-align: right; font-variant-numeric: tabular-nums; }
.row .num span { color: var(--muted); margin-left: 4px; }
.row.lead .name { color: var(--text); font-weight: 600; }

/* diverging Q4 stack */
.stack { display: flex; gap: 2px; height: 22px; border-radius: 4px; overflow: hidden; background: var(--surface); }
.stack > i { display: block; height: 100%; transition: flex-grow .6s cubic-bezier(.2,.8,.2,1); min-width: 0; }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 13px; color: var(--text-2); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 4px; }

/* tooltip */
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--text); color: var(--bg); font-size: 13px; padding: 6px 9px; border-radius: 6px; max-width: 260px; }

/* ---------- A: grid ---------- */
.kpi .label { color: var(--text-2); font-size: 13px; font-weight: 500; }
.kpi .value { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; margin-top: 4px; }
.kpi .sub { color: var(--muted); font-size: 13px; }
.kpi .stack { height: 8px; margin-top: 10px; }
.cols { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; align-items: end; height: 170px; border-bottom: 1px solid var(--border); }
.col { display: flex; flex-direction: column; justify-content: end; align-items: center; height: 100%; gap: 6px; }
.col .bar { width: 60%; max-width: 56px; border-radius: 4px 4px 0 0; height: 0; transition: height .6s cubic-bezier(.2,.8,.2,1); }
.col .v { font-size: 13px; font-variant-numeric: tabular-nums; }
.axis { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; color: var(--text-2); font-size: 13px; margin-top: 6px; }
.texts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 360px; overflow-y: auto; }
.texts li { padding: 10px 12px; border-radius: 8px; background: var(--bg); font-size: 14px; overflow-wrap: anywhere; }
.texts .meta { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; color: var(--series); margin-right: 6px; text-transform: uppercase; letter-spacing: .05em; }
.count { color: var(--muted); font-weight: 500; }

/* ---------- B: big screen ---------- */
.big { display: grid; gap: 2.2cqi; grid-template-columns: 5fr 7fr; }
@container (max-width: 760px) { .big { grid-template-columns: 1fr; } }
.big .card { padding: clamp(16px, 2.2cqi, 36px); }
.hero { display: grid; gap: 1.6cqi; align-content: start; }
.hero-n { font-size: clamp(72px, 13cqi, 220px); font-weight: 800; letter-spacing: -.05em; line-height: .9; }
.hero-n small { font-size: .26em; font-weight: 600; letter-spacing: -.01em; color: var(--text-2); margin-left: .2em; }
.hero-line { font-size: clamp(18px, 2.1cqi, 34px); line-height: 1.25; color: var(--text-2); text-wrap: balance; }
.hero-line b { color: var(--text); }
.big .stack { height: clamp(22px, 3cqi, 52px); }
.big .key { font-size: clamp(13px, 1.25cqi, 20px); }
.big .ends { font-size: clamp(12px, 1.1cqi, 18px); }
.ticker { display: grid; gap: 1.4cqi; align-content: start; }
.tick-label { font-size: clamp(12px, 1.15cqi, 18px); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); display: flex; justify-content: space-between; gap: 12px; }
.tick-now { font-size: clamp(22px, 3.1cqi, 52px); font-weight: 600; line-height: 1.2; letter-spacing: -.02em; overflow-wrap: anywhere; min-height: 2.4em; text-wrap: pretty; }
.tick-now.in { animation: rise .5s ease-out; }
@keyframes rise { from { opacity: .2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.tick-meta { font-size: clamp(13px, 1.2cqi, 20px); color: var(--muted); }
.tick-prev { list-style: none; padding: 0; margin: 0; display: grid; gap: .6cqi; border-top: 1px solid var(--border); padding-top: 1.2cqi; }
.tick-prev li { font-size: clamp(14px, 1.5cqi, 24px); color: var(--text-2); overflow-wrap: anywhere; }
.tick-prev li span { color: var(--muted); font-size: .8em; margin-left: 8px; }
.trio { grid-column: 1 / -1; display: grid; gap: 2.2cqi; grid-template-columns: repeat(3, 1fr); }
@container (max-width: 760px) { .trio { grid-template-columns: 1fr; } }
.trio h2 { font-size: clamp(15px, 1.5cqi, 24px); margin-bottom: 1cqi; }
.trio .row { font-size: clamp(13px, 1.25cqi, 20px); grid-template-columns: minmax(90px, 44%) 1fr 3.4em; }
.trio .track { height: clamp(14px, 1.5cqi, 26px); }
.trio .fill { background: var(--dim); }
.trio .row.lead .fill { background: var(--series); }

/* ---------- C: cross-tab ---------- */
.heat { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 14px; }
.heat th { font-weight: 500; color: var(--text-2); padding: 6px 8px; text-align: center; }
.heat th.rh { text-align: left; white-space: nowrap; }
.heat td { text-align: center; height: 44px; border-radius: 4px; font-variant-numeric: tabular-nums; font-weight: 600; }
.heat td.m { background: transparent; color: var(--text-2); font-weight: 500; }
.heat tr.pick th.rh button { color: var(--text); }
.heat .rh button { border: 0; background: none; padding: 4px 6px; margin: -4px -6px; cursor: pointer; color: var(--text-2); text-align: left; border-radius: 6px; font-weight: 500; }
.heat .rh button[aria-pressed="true"] { background: var(--series-soft); color: var(--text); font-weight: 600; }
.heat tfoot td { height: auto; color: var(--muted); font-weight: 500; padding-top: 4px; }
.scroll { overflow-x: auto; }
.legend-ramp { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 10px; }
.legend-ramp i { width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, color-mix(in oklab, var(--series) 6%, var(--surface)), var(--series)); }
.story { font-size: 18px; line-height: 1.4; margin: 0 0 12px; text-wrap: pretty; }
.story b { font-weight: 700; }
table.ans { width: 100%; border-collapse: collapse; font-size: 14px; }
table.ans th { text-align: left; font-weight: 500; color: var(--text-2); font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.ans td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
table.ans td.n { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; min-width: 24px; text-align: center; border-radius: 999px; padding: 1px 8px; font-weight: 600; font-size: 13px; }
.filterinfo { font-size: 13px; color: var(--text-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
</style>
</head>
<body>

<div class="wrap">
  <section class="mock" aria-label="Visning">
    <div class="mock-top">
      <div class="seg" role="group" aria-label="Velg visning">
        <button type="button" id="optB" data-v="B" aria-pressed="false">Storskjerm</button>
        <button type="button" id="optA" data-v="A" aria-pressed="false">Rutenett</button>
        <button type="button" id="optC" data-v="C" aria-pressed="false">Kryssanalyse</button>
      </div>
      <div class="sim"><label class="chk"><input type="checkbox" id="hideTest" checked> Skjul testsvar</label></div>
    </div>
  </section>

  <main class="stage" id="stage"></main>
</div>
<div id="tip" hidden></div>

<script>
const OPT = {
  Q1: ["Aldri", "Har prøvd", "Ukentlig", "Daglig"],
  Q2: ["Lokal KI", "Byggeklossene", "Hareg", "Frustrasjon med sikker sone"],
  Q3: ["Tilgang eller godkjenning", "Tid", "Vet ikke hva jeg skal bruke den til", "Stoler ikke på resultatet", "Virker ikke på maskinen min", "Ingenting"],
};
const TITLE = { Q1: "Erfaring før i dag", Q2: "Mest nyttig i dag", Q3: "Største hinder" };
const QTEXT = {
  Q1: "Hvor ofte brukte du en KI-agent (ikke bare kodefullføring) før i dag?",
  Q2: "Hva var mest nyttig i dag?",
  Q3: "Hva stopper deg mest fra å bruke agent i jobben?",
  Q4: "Hvor sannsynlig er det at du bruker en agent på en ekte arbeidsoppgave neste uke?",
};
// ---------- state ----------
const $ = id => document.getElementById(id);
let rows = [], view = "B", seen = null, newest = new Set(), online = false;
let showQ6 = false, pickQ1 = null, tickT = null, tickI = 0;
try { $("hideTest").checked = localStorage.getItem("spor3-hideTest") !== "0"; } catch {}
try { const v = localStorage.getItem("spor3-view"); if ("ABC".includes(v) && v) view = v; } catch {}

const isTest = r => r.Q5 === "[test]" && r.Q6 === "[test]";
const vis = () => $("hideTest").checked ? rows.filter(r => !isTest(r)) : rows;
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const dec = x => x.toFixed(1).replace(".", ",");
const time = iso => new Date(iso).toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Oslo" });
function count(rs, q, opts = OPT[q]) { const c = Object.fromEntries(opts.map(o => [o, 0])); for (const r of rs) if (r[q] in c) c[r[q]]++; return c; }
function q4s(rs) { return rs.map(r => +r.Q4).filter(x => x >= 1 && x <= 5); }
function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// ---------- shared components ----------
function bars(host, q, rs, emphasize) {
  const c = count(rs, q), max = Math.max(1, ...Object.values(c)), lead = Math.max(...Object.values(c));
  if (host.children.length !== OPT[q].length) host.innerHTML = OPT[q].map(() =>
    `<div class="row"><span class="name"></span><div class="track"><div class="fill"></div></div><span class="num tn"></span></div>`).join("");
  OPT[q].forEach((o, i) => {
    const row = host.children[i];
    row.dataset.tip = `${o}: ${c[o]} svar (${pct(c[o], rs.length)} %)`;
    row.classList.toggle("lead", emphasize && c[o] === lead && lead > 0);
    row.querySelector(".name").textContent = o;
    row.querySelector(".fill").style.width = `${100 * c[o] / max}%`;
    row.querySelector(".num").innerHTML = emphasize ? `${pct(c[o], rs.length)} %` : `${c[o]}<span>${pct(c[o], rs.length)} %</span>`;
  });
}
const Q4LBL = ["", "1 Ikke i det hele tatt", "2", "3", "4", "5 Helt sikkert"];
function stack(host, rs, withKey) {
  const c = count(rs, "Q4", ["1","2","3","4","5"]), n = q4s(rs).length;
  if (!host.querySelector(".stack")) host.innerHTML = `<div class="stack" role="img">${[1,2,3,4,5].map(v => `<i style="background:var(--d${v})"></i>`).join("")}</div>` +
    (withKey ? `<div class="key">${[1,2,3,4,5].map(v => `<span><i style="background:var(--d${v})"></i><b class="tn"></b></span>`).join("")}</div><div class="ends"><span>1 = ikke i det hele tatt</span><span>5 = helt sikkert</span></div>` : "");
  const st = host.querySelector(".stack");
  st.setAttribute("aria-label", `Fordeling 1–5: ${[1,2,3,4,5].map(v => `${v}: ${c[v]}`).join(", ")}`);
  [...st.children].forEach((seg, i) => { const v = i + 1; seg.style.flexGrow = c[v]; seg.style.flexBasis = 0; seg.hidden = !c[v]; seg.dataset.tip = `${v}: ${c[v]} svar (${pct(c[v], n)} %)`; });
  if (withKey) [...host.querySelectorAll(".key b")].forEach((b, i) => b.textContent = `${i + 1} · ${c[i + 1]}`);
}
function flash(el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
function liveDot() { return `<span class="live"><span class="dot${online ? "" : " off"}"></span><span>${online ? "Live" : "Frakoblet – prøver igjen …"} · siste svar ${rows.length ? time(rows.at(-1).mottatt) : "–"}</span></span>`; }
function head(title) { return `<div class="head"><div><div class="eyebrow">Nasjonalarkivet · Spor 3 · Oslo</div><h1>${title}</h1></div>${liveDot()}</div>`; }

// ---------- A ----------
function renderA(rs, fresh) {
  const st = $("stage");
  if (!st.querySelector(".gridA")) {
    st.innerHTML = head("Tilbakemeldinger") + `<div class="grid gridA">
      <div class="card kpi s3" id="kN"><div class="label">Antall svar</div><div class="value tn"></div><div class="sub"></div></div>
      <div class="card kpi s3" id="kAvg"><div class="label">Snitt sannsynlighet neste uke</div><div class="value"></div><div class="sub">på skala 1–5</div><div id="kStack"></div></div>
      <div class="card kpi s3" id="kTop"><div class="label">Svarer 4 eller 5</div><div class="value"></div><div class="sub">«sannsynlig» eller mer</div></div>
      <div class="card kpi s3" id="kWk"><div class="label">Brukte agent ukentlig+</div><div class="value"></div><div class="sub">før i dag</div></div>
      <section class="card s6"><h2>${TITLE.Q1}</h2><p class="q">${QTEXT.Q1}</p><div class="bars" id="aQ1"></div></section>
      <section class="card s6"><h2>Sannsynlighet neste uke</h2><p class="q">${QTEXT.Q4}</p><div class="cols" id="aQ4"></div><div class="axis"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><div class="ends"><span>Ikke i det hele tatt</span><span>Helt sikkert</span></div></section>
      <section class="card s6"><h2>${TITLE.Q2}</h2><p class="q">${QTEXT.Q2}</p><div class="bars" id="aQ2"></div></section>
      <section class="card s6"><h2>${TITLE.Q3}</h2><p class="q">${QTEXT.Q3}</p><div class="bars" id="aQ3"></div></section>
      <section class="card s6"><h2>Oppgaver de vil prøve <span class="count" id="cQ5"></span></h2><p class="q">Én konkret oppgave fra jobben</p><ul class="texts" id="aQ5"></ul></section>
      <section class="card s6"><h2>Endre til neste gang <span class="count" id="cQ6"></span></h2><p class="q">Én ting vi bør endre</p><ul class="texts" id="aQ6"></ul></section></div>`;
  } else st.querySelector(".live").outerHTML = liveDot();
  const n = rs.length, q4 = q4s(rs);
  const kpi = (id, v, sub) => { const e = $(id), x = e.querySelector(".value"); if (x.textContent !== v) { x.textContent = v; if (fresh) flash(e); } if (sub) e.querySelector(".sub").textContent = sub; };
  kpi("kN", String(n), n ? `siste ${time(rs.at(-1).mottatt)}` : "venter på første svar");
  kpi("kAvg", q4.length ? dec(q4.reduce((a, b) => a + b) / q4.length) : "–");
  kpi("kTop", n ? `${pct(q4.filter(x => x >= 4).length, q4.length)} %` : "–");
  kpi("kWk", n ? `${pct(rs.filter(r => r.Q1 === "Ukentlig" || r.Q1 === "Daglig").length, n)} %` : "–");
  stack($("kStack"), rs, false);
  ["Q1","Q2","Q3"].forEach(q => bars($("a" + q), q, rs, false));
  const c = count(rs, "Q4", ["1","2","3","4","5"]), max = Math.max(1, ...Object.values(c)), h = $("aQ4");
  if (!h.children.length) h.innerHTML = [1,2,3,4,5].map(v => `<div class="col"><span class="v"></span><div class="bar" style="background:var(--d${v})"></div></div>`).join("");
  [1,2,3,4,5].forEach((v, i) => { const col = h.children[i]; col.dataset.tip = `${v}: ${c[v]} svar (${pct(c[v], n)} %)`; col.querySelector(".v").textContent = c[v]; col.querySelector(".bar").style.height = `calc(${c[v] / max} * (100% - 28px))`; });
  for (const q of ["Q5","Q6"]) {
    const items = rs.filter(r => r[q] && r[q] !== "[test]").reverse();
    $("c" + q).textContent = `· ${items.length}`;
    $("a" + q).replaceChildren(...(items.length ? items.map(r => {
      const li = mk("li"); if (newest.has(r.id)) { li.append(mk("span", "badge", "Ny")); li.classList.add("flash"); }
      li.append(document.createTextNode(r[q]));            // free text: always textContent
      li.append(mk("span", "meta", `#${r.id} · ${time(r.mottatt)}`)); return li;
    }) : [mk("li", "empty", "Ingen svar ennå")]));
  }
}

// ---------- B ----------
function tickItems(rs) {
  const out = [];
  for (const r of rs) { if (r.Q5 && r.Q5 !== "[test]") out.push({ r, q: "Q5", t: r.Q5 }); if (showQ6 && r.Q6 && r.Q6 !== "[test]") out.push({ r, q: "Q6", t: r.Q6 }); }
  return out.reverse().slice(0, 8);
}
function renderB(rs, fresh) {
  const st = $("stage");
  if (!st.querySelector(".big")) {
    st.innerHTML = head("Hva sier salen?") + `<div class="big">
      <section class="card hero" id="bHero"><div class="hero-n tn" id="bN"></div><p class="hero-line" id="bLine"></p><div id="bStack"></div></section>
      <section class="card ticker" aria-live="polite"><div class="tick-label"><span id="bTickLbl"></span>
        <button type="button" class="btn" id="bQ6" aria-pressed="false">Vis også «endre»</button></div>
        <div class="tick-now" id="bNow"></div><div class="tick-meta" id="bMeta"></div><ul class="tick-prev" id="bPrev"></ul></section>
      <div class="trio">${["Q1","Q2","Q3"].map(q => `<section class="card"><h2>${TITLE[q]}</h2><div class="bars" id="b${q}"></div></section>`).join("")}</div></div>`;
    $("bQ6").onclick = () => { showQ6 = !showQ6; tickI = 0; render(false); };
  } else st.querySelector(".live").outerHTML = liveDot();
  $("bQ6").setAttribute("aria-pressed", showQ6);
  const n = rs.length, q4 = q4s(rs), avg = q4.length ? q4.reduce((a, b) => a + b) / q4.length : 0;
  const nEl = $("bN"); const nTxt = String(n);
  if (nEl.firstChild?.textContent !== nTxt) { nEl.innerHTML = `${n}<small>svar</small>`; if (fresh) flash($("bHero")); }
  $("bLine").innerHTML = n ? `<b>${pct(q4.filter(x => x >= 4).length, q4.length)} %</b> tror de bruker en agent på en ekte oppgave neste uke. Snitt <b>${dec(avg)}</b> av 5.` : "Venter på første svar …";
  stack($("bStack"), rs, true);
  ["Q1","Q2","Q3"].forEach(q => bars($("b" + q), q, rs, true));
  if (fresh) tickI = 0;
  drawTick(rs, fresh);
}
function drawTick(rs, animate) {
  const items = tickItems(rs);
  $("bTickLbl").textContent = showQ6 ? "Nyeste fritekstsvar" : "Dette vil de prøve agenten på";
  if (!items.length) { $("bNow").textContent = "Ingen fritekstsvar ennå"; $("bMeta").textContent = ""; $("bPrev").replaceChildren(); return; }
  const cur = items[tickI % items.length];
  const now = $("bNow"); now.textContent = cur.t;           // free text: always textContent
  if (animate) { now.classList.remove("in"); void now.offsetWidth; now.classList.add("in"); }
  $("bMeta").textContent = `${newest.has(cur.r.id) ? "Nytt · " : ""}${cur.q === "Q6" ? "Endre til neste gang · " : ""}${time(cur.r.mottatt)}`;
  $("bPrev").replaceChildren(...items.filter(x => x !== cur).slice(0, 3).map(x => { const li = mk("li", null, x.t); li.append(mk("span", null, time(x.r.mottatt))); return li; }));
}

// ---------- C ----------
function renderC(rs) {
  const st = $("stage");
  st.innerHTML = head("Erfaring og vilje") + `<div class="grid">
    <section class="card s7"><h2>Erfaring × sannsynlighet neste uke</h2><p class="q">Rader: ${QTEXT.Q1} Kolonner: sannsynlighet 1–5. Klikk en rad for å filtrere svarene.</p>
      <div class="scroll"><table class="heat" id="cHeat"></table></div><div class="legend-ramp"><span>0</span><i></i><span id="cMax"></span><span>svar per celle</span></div></section>
    <section class="card s5"><h2>Kort fortalt</h2><p class="q">Oppdateres med hvert svar</p><div id="cStory"></div>
      <h2 style="margin-top:18px">${TITLE.Q3}</h2><p class="q">${QTEXT.Q3}</p><div class="bars" id="cQ3"></div></section>
    <section class="card s12"><h2>Svar</h2><div class="filterinfo" id="cFilter"></div><div class="scroll"><table class="ans"><thead><tr><th>Tid</th><th>Erfaring</th><th>Q4</th><th>Oppgave de vil prøve</th><th>Endre til neste gang</th></tr></thead><tbody id="cBody"></tbody></table></div></section></div>`;
  const grid = OPT.Q1.map(o => [1,2,3,4,5].map(v => rs.filter(r => r.Q1 === o && +r.Q4 === v).length));
  const max = Math.max(1, ...grid.flat());
  $("cMax").textContent = max;
  const t = $("cHeat");
  t.innerHTML = `<thead><tr><th></th>${[1,2,3,4,5].map(v => `<th>${v}</th>`).join("")}<th>n</th><th>Snitt</th></tr></thead>`;
  const tb = mk("tbody");
  OPT.Q1.forEach((o, i) => {
    const tr = mk("tr"), th = mk("th", "rh"), b = mk("button", null, o);
    b.type = "button"; b.setAttribute("aria-pressed", pickQ1 === o); b.onclick = () => { pickQ1 = pickQ1 === o ? null : o; render(false); };
    th.append(b); tr.append(th);
    grid[i].forEach((k, j) => { const p = k ? 12 + 88 * k / max : 0; const td = mk("td", null, k || "");
      td.style.background = k ? `color-mix(in oklab, var(--series) ${p}%, var(--surface))` : "var(--track)";
      td.style.color = p > 55 ? "var(--on-strong)" : "var(--text)"; td.dataset.tip = `${o}, svarte ${j + 1}: ${k} svar`; tr.append(td); });
    const rn = grid[i].reduce((a, b) => a + b), s = grid[i].reduce((a, k, j) => a + k * (j + 1), 0);
    tr.append(mk("td", "m", rn), mk("td", "m", rn ? dec(s / rn) : "–")); tb.append(tr);
  });
  t.append(tb);
  const tf = mk("tfoot"), fr = mk("tr"); fr.append(mk("td"));
  [1,2,3,4,5].forEach(v => fr.append(mk("td", null, grid.reduce((a, g) => a + g[v - 1], 0)))); fr.append(mk("td", null, rs.length), mk("td")); tf.append(fr); t.append(tf);
  // story
  const lo = rs.filter(r => r.Q1 === "Aldri" || r.Q1 === "Har prøvd"), hi = rs.filter(r => r.Q1 === "Ukentlig" || r.Q1 === "Daglig");
  const share = g => pct(q4s(g).filter(x => x >= 4).length, q4s(g).length);
  const sp = $("cStory"); sp.replaceChildren();
  const p1 = mk("p", "story"); p1.innerHTML = `Av dem som <b>aldri eller bare har prøvd</b> (${lo.length}), svarer <b>${share(lo)} %</b> 4–5.`;
  const p2 = mk("p", "story"); p2.innerHTML = `Av dem som allerede bruker agent <b>ukentlig eller daglig</b> (${hi.length}), svarer <b>${share(hi)} %</b> 4–5.`;
  sp.append(p1, p2, mk("p", "q", "Få svar per gruppe: les det som en pekepinn, ikke et funn."));
  bars($("cQ3"), "Q3", rs, false);
  // answers
  const list = (pickQ1 ? rs.filter(r => r.Q1 === pickQ1) : rs).slice().reverse();
  const fi = $("cFilter");
  fi.textContent = pickQ1 ? `Viser ${list.length} svar med erfaring «${pickQ1}».` : `Viser alle ${list.length} svar, nyeste først.`;
  if (pickQ1) { const cb = mk("button", "btn", "Vis alle"); cb.type = "button"; cb.onclick = () => { pickQ1 = null; render(false); }; fi.append(cb); }
  $("cBody").replaceChildren(...(list.length ? list.map(r => {
    const tr = mk("tr"); const pill = mk("span", "pill", r.Q4);
    pill.style.background = `var(--d${r.Q4})`; pill.style.color = +r.Q4 === 5 || +r.Q4 === 1 ? "var(--on-strong)" : "var(--text)";
    const q4td = mk("td"); q4td.append(pill);
    tr.append(mk("td", "n", (newest.has(r.id) ? "Ny · " : "") + time(r.mottatt)), mk("td", null, r.Q1), q4td,
      mk("td", null, r.Q5 === "[test]" ? "(testsvar)" : r.Q5), mk("td", null, r.Q6 === "[test]" ? "(testsvar)" : (r.Q6 || "–")));
    if (newest.has(r.id)) tr.classList.add("flash");
    return tr;
  }) : [(() => { const tr = mk("tr"), td = mk("td", "empty", "Ingen svar i denne gruppen"); td.colSpan = 5; tr.append(td); return tr; })()]));
}

// ---------- wiring ----------
function render(fresh) {
  const rs = vis();
  ["A","B","C"].forEach(v => $("opt" + v).setAttribute("aria-pressed", v === view));
  ({ A: renderA, B: renderB, C: renderC })[view](rs, fresh);
}
function switchTo(v) { view = v; try { localStorage.setItem("spor3-view", v); } catch {} $("stage").replaceChildren(); render(false); }
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => switchTo(b.dataset.v));
$("hideTest").onchange = () => { try { localStorage.setItem("spor3-hideTest", $("hideTest").checked ? "1" : "0"); } catch {} render(false); };
let lastTxt = "";
async function poll() {
  let changed = !online;
  try {
    const txt = await (await fetch("/data", { cache: "no-store" })).text();
    online = true;
    if (txt !== lastTxt) {
      lastTxt = txt; rows = JSON.parse(txt); changed = true;
      newest = seen ? new Set(rows.map(r => r.id).filter(id => !seen.has(id))) : new Set();
      seen = new Set(rows.map(r => r.id));
    }
  } catch { changed = online; online = false; }
  if (changed) render(newest.size > 0);
  setTimeout(poll, 2000);
}
// ticker rotation (B only)
tickT = setInterval(() => { if (view === "B" && $("bNow")) { tickI++; drawTick(vis(), true); } }, 7000);
// tooltip for any [data-tip]
const tip = $("tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest?.("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (e.clientY + 16) + "px";
});
poll();
</script>
</body>
